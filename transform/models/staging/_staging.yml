version: 2

models:
  - name: stg_sales_orders
    description: "Typed and enriched order lines. One row per order."
    columns:
      - name: order_id
        description: "Order identifier — the grain of this model"
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Customer identifier"
      - name: product_category
        description: "Beauty, Clothing, Electronics, Home"
      - name: region
        description: "East, North, South, West"
      - name: payment_method
        description: "Card, COD, Wallet"
      - name: order_date
        description: "Parsed order date"
      - name: order_month
        description: "First day of the order month"
      - name: gross_revenue
        description: "Revenue before discount (quantity * unit_price)"
      - name: net_revenue
        description: "Revenue after discount, as supplied by the source"
      - name: discount_amount
        description: "Money given away as discount"
      - name: is_future_order
        description: "Synthetic data artefact — order dated after today"
