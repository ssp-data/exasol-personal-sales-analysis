version: 2

models:
  - name: dim_category
    description: "Product category dimension."
    columns:
      - name: category_key
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: category_name
        description: "Beauty, Clothing, Electronics, Home"

  - name: dim_region
    description: "Sales region dimension."
    columns:
      - name: region_key
        description: "Surrogate key"
        data_tests: [unique, not_null]
      - name: region_name
        description: "East, North, South, West"

  - name: dim_customer
    description: "Customer dimension with lifetime value and segment."
    columns:
      - name: customer_key
        description: "Customer identifier, used as the surrogate key"
        data_tests: [unique, not_null]
      - name: first_order_date
        description: "First order placed"
      - name: last_order_date
        description: "Most recent order placed"
      - name: lifetime_orders
        description: "Orders placed to date"
      - name: lifetime_revenue
        description: "Net revenue to date"
      - name: customer_segment
        description: "High (>= 10000 lifetime revenue), Medium (>= 5000), or Low"

  - name: fct_orders
    description: "Order fact, distributed by customer_key. One row per order."
    columns:
      - name: order_id
        description: "Order identifier — the grain of this table"
        data_tests: [unique, not_null]
      - name: customer_key
        description: "Foreign key to dim_customer"
        data_tests:
          - not_null
          - relationships: { to: ref('dim_customer'), field: customer_key }
      - name: category_key
        description: "Foreign key to dim_category"
        data_tests:
          - not_null
          - relationships: { to: ref('dim_category'), field: category_key }
      - name: region_key
        description: "Foreign key to dim_region"
        data_tests:
          - not_null
          - relationships: { to: ref('dim_region'), field: region_key }
      - name: net_revenue
        description: "Revenue after discount"
      - name: gross_revenue
        description: "Revenue before discount"
      - name: discount_amount
        description: "Money given away as discount"
      - name: is_future_order
        description: "Synthetic data artefact — order dated after today"
