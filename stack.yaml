# =============================================================================
# stack.yaml — the metrics and the marts.
#
# This is the only generated part of the stack, and deliberately so: metrics and
# marts are the pieces that repeat, so a compiler earns its keep. Everything
# else — the raw DDL, the staging view, the star schema — is ordinary
# hand-written SQL under sql/ and transform/models/, because generating a file
# you write once costs more than it saves.
#
#   stack.yaml  ->  engine/render.py  ->  transform/models/marts/*
# =============================================================================

runtime:
  model_schema: SALES

# -----------------------------------------------------------------------------
# The star. Marts below name a dimension; the engine works out the join.
# `model` + `key` mean "join this dimension table"; a dimension with only a
# `column` is degenerate and lives on the fact table itself.
# -----------------------------------------------------------------------------
star:
  fact: fct_orders
  dimensions:
    - { name: product_category,  model: dim_category, key: category_key, column: category_name }
    - { name: region,            model: dim_region,   key: region_key,   column: region_name }
    - { name: customer_id,       model: dim_customer, key: customer_key, column: customer_key }
    - { name: customer_segment,  model: dim_customer, key: customer_key, column: customer_segment }
    - { name: order_month,       column: order_month }
    - { name: payment_method,    column: payment_method }

# -----------------------------------------------------------------------------
# Metrics (or semantic layer): Defined once, reused by every mart, and pushed
# into the Exasol catalog as column comments so the MCP server hands them to the
# agent along with the schema.
# -----------------------------------------------------------------------------
metrics:
  - name: revenue
    expr: "SUM(f.net_revenue)"
    description: "Net revenue after discount"
  - name: gross_revenue
    expr: "SUM(f.gross_revenue)"
    description: "Revenue before discount"
  - name: discount_amount
    expr: "SUM(f.discount_amount)"
    description: "Total discount given"
  - name: orders
    expr: "COUNT(DISTINCT f.order_id)"
    description: "Number of orders"
  - name: units
    expr: "SUM(f.quantity)"
    description: "Units sold"
  - name: avg_order_value
    expr: "CAST(SUM(f.net_revenue) / NULLIF(COUNT(DISTINCT f.order_id), 0) AS DECIMAL(18,2))"
    description: "Net revenue per order"
  - name: avg_discount_pct
    expr: "CAST(AVG(f.discount) * 100 AS DECIMAL(5,2))"
    description: "Average discount, in percent"
  - name: avg_rating
    expr: "CAST(AVG(f.customer_rating) AS DECIMAL(3,2))"
    description: "Average customer rating"
  - name: avg_delivery_days
    expr: "CAST(AVG(f.delivery_days) AS DECIMAL(4,1))"
    description: "Average days to delivery"

# -----------------------------------------------------------------------------
# Marts — the outcome datasets. A grain and a list of metrics.
# -----------------------------------------------------------------------------
marts:
  - name: mart_revenue_by_category
    description: Revenue and margin-giveaway per product category.
    dimensions: [product_category]
    metrics: [revenue, gross_revenue, discount_amount, orders, units, avg_order_value, avg_discount_pct, avg_rating]
    order_by: "revenue DESC"

  - name: mart_revenue_by_region
    description: Revenue and service quality per region.
    dimensions: [region]
    metrics: [revenue, orders, units, avg_order_value, avg_discount_pct, avg_rating, avg_delivery_days]
    order_by: "revenue DESC"

  - name: mart_revenue_monthly
    description: Monthly revenue trend across the whole dataset.
    dimensions: [order_month]
    metrics: [revenue, gross_revenue, discount_amount, orders, units, avg_order_value]
    order_by: "order_month"

  - name: mart_category_region
    description: Category by region cross-tab — where each category actually sells.
    dimensions: [product_category, region]
    metrics: [revenue, orders, units, avg_order_value, avg_rating]
    order_by: "revenue DESC"

  - name: mart_payment_method
    description: Revenue and delivery experience per payment method.
    dimensions: [payment_method]
    metrics: [revenue, orders, avg_order_value, avg_discount_pct, avg_rating, avg_delivery_days]
    order_by: "revenue DESC"

  - name: mart_segment_category
    description: Which customer segments carry which categories.
    dimensions: [customer_segment, product_category]
    metrics: [revenue, orders, avg_order_value, avg_rating]
    order_by: "revenue DESC"

  - name: mart_customer_value
    description: Per-customer lifetime value and activity window.
    dimensions: [customer_id]
    metrics: [revenue, orders, units, avg_order_value, avg_rating]
    extra_metrics:
      - { name: first_order_date, expr: "MIN(f.order_date)",                    description: "First order" }
      - { name: last_order_date,  expr: "MAX(f.order_date)",                    description: "Most recent order" }
      - { name: active_days,      expr: "MAX(f.order_date) - MIN(f.order_date)", description: "Days between first and last order" }
    order_by: "revenue DESC"
